name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build packages/ui (source-only, no native deps) so downstream consumers typecheck cleanly
      - run: pnpm -F @apogee/ui typecheck
      # Web app — lint, typecheck, test (no native dependency chain)
      - run: pnpm -F @apogee/web lint
      - run: pnpm -F @apogee/web typecheck
      - run: pnpm -F @apogee/web test
      # Edge API
      - run: pnpm -F @apogee/edge typecheck
      # Billing
      - run: pnpm -F @apogee/billing typecheck
