name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build pure-TS packages (no native deps) so downstream consumers can typecheck
      - run: pnpm -F @apogee/chain-client build
      - run: pnpm -F @apogee/storage-client build
      - run: pnpm -F @apogee/compute-client build
      - run: pnpm -F @apogee/memory build
      - run: pnpm -F @apogee/billing build
      # Web app (imports only @apogee/ui which exports from source — no build needed)
      - run: pnpm -F @apogee/web lint
      - run: pnpm -F @apogee/web typecheck
      - run: pnpm -F @apogee/web test
      # Edge API (imports billing, chain-client, storage-client — built above)
      - run: pnpm -F @apogee/edge typecheck
      # Billing standalone typecheck
      - run: pnpm -F @apogee/billing typecheck
